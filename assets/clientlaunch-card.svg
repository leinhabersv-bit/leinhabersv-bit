<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 130" width="100%" height="auto">
  <defs>
    <linearGradient id="claunch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="claunch-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="920" height="130" rx="12" fill="url(#claunch-bg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <path d="M 16 1 L 904 1" stroke="url(#claunch-accent)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Icon & Title -->
  <g transform="translate(28, 28)">
    <rect width="44" height="44" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="22" y="28" font-size="20" text-anchor="middle">⚡</text>
  </g>

  <g transform="translate(86, 38)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="-0.3">
      ClientLaunch <tspan font-size="12" font-weight="600" fill="#38bdf8" dx="8">● COMMERCIAL SUITE (v1.0.0)</tspan>
    </text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Offline-First Commercial Web Suite for SMM Freelancers • IndexedDB, Vitest &amp; Playwright E2E
    </text>
  </g>

  <!-- Metrics / Badges right aligned -->
  <g transform="translate(620, 36)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
    <text x="65" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">OFFLINE FIRST</text>

    <rect x="140" y="0" width="130" height="28" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="205" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">E2E TESTED</text>
  </g>

  <!-- Tags line -->
  <g transform="translate(86, 96)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">
