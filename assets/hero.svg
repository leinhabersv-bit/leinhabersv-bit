<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0e1626"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <pattern id="grid-pattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
    </pattern>
    <radialGradient id="ambient-cyan" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(0, 245, 212, 0.12)"/>
      <stop offset="100%" stop-color="rgba(0, 245, 212, 0)"/>
    </radialGradient>
    <radialGradient id="ambient-violet" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.10)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0)"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="920" height="280" rx="16" fill="url(#bg-grad)"/>
  <rect width="920" height="280" rx="16" fill="url(#grid-pattern)"/>
  <rect width="920" height="280" rx="16" fill="url(#ambient-cyan)"/>
  <rect width="920" height="280" rx="16" fill="url(#ambient-violet)"/>
  <rect width="918" height="278" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Top Accent Bar -->
  <path d="M 20 1 L 900 1" stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round"/>

  <!-- Status / Mode Badge -->
  <g transform="translate(48, 38)">
    <rect width="210" height="26" rx="13" fill="rgba(0, 245, 212, 0.08)" stroke="rgba(0, 245, 212, 0.25)" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#00f5d4"/>
    <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">STUDENT DEVELOPER</text>
  </g>

  <!-- Terminal Location Indicator -->
  <g transform="translate(710, 38)">
    <text x="0" y="17" font-family="'JetBrains Mono', monospace, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">~ / leinhabersv-bit</text>
  </g>

  <!-- Title / Name -->
  <text x="48" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
    RITHIK SV
  </text>
  <text x="290" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#64748b">
    • Software &amp; Systems Builder
  </text>

  <!-- Editorial Subheading -->
  <text x="48" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="-0.1">
    Crafting ambitious interactive web applications, local-first architectures, and high-performance frontend systems.
  </text>

  <!-- Bottom Metric & Stack Badges -->
  <g transform="translate(48, 192)">
    <!-- Pill 1: TypeScript -->
    <g transform="translate(0, 0)">
      <rect width="115" height="34" rx="8" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#38bdf8"/>
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">TypeScript</text>
    </g>

    <!-- Pill 2: Next.js / React -->
    <g transform="translate(127, 0)">
      <rect width="138" height="34" rx="8" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#a855f7"/>
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">React / Next.js</text>
    </g>

    <!-- Pill 3: Three.js & 2D Canvas -->
    <g transform="translate(277, 0)">
      <rect width="168" height="34" rx="8" fill="url(#card-grad)" stroke="rgba(0, 245, 212, 0.2)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#00f5d4"/>
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Three.js &amp; Canvas</text>
    </g>

    <!-- Pill 4: Offline-First / IndexedDB -->
    <g transform="translate(457, 0)">
      <rect width="180" height="34" rx="8" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#38bdf8"/>
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Local-First / IndexedDB</text>
    </g>

    <!-- Pill 5: Rigorous Testing -->
    <g transform="translate(649, 0)">
      <rect width="170" height="34" rx="8" fill="url(#card-grad)" stroke="rgba(168, 85, 247, 0.2)" stroke-width="1"/>
      <circle cx="16" cy="17" r="4" fill="#a855f7"/>
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Playwright &amp; Vitest</text>
    </g>
  </g>
</svg>