<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="45%" stop-color="#090d18"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="accent-cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 245, 212, 0)"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)"/>
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.05)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.015)"/>
    </linearGradient>

    <pattern id="dot-matrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255, 255, 255, 0.04)"/>
    </pattern>

    <radialGradient id="glow-cyan" cx="12%" cy="18%" r="65%">
      <stop offset="0%" stop-color="rgba(0, 245, 212, 0.16)"/>
      <stop offset="100%" stop-color="rgba(0, 245, 212, 0)"/>
    </radialGradient>

    <radialGradient id="glow-violet" cx="88%" cy="82%" r="55%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.14)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0)"/>
    </radialGradient>

    <clipPath id="frame-clip">
      <rect width="940" height="320" rx="16"/>
    </clipPath>

    <style>
      @keyframes beamSlide {
        0% { transform: translateX(-350px); }
        60%, 100% { transform: translateX(960px); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.9; }
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .anim-beam {
        animation: beamSlide 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .anim-glow {
        animation: pulseAura 4s ease-in-out infinite;
      }
      .anim-status {
        animation: statusBlink 2.4s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .anim-beam, .anim-glow, .anim-status {
          animation: none !important;
          opacity: 0.7 !important;
        }
      }
    </style>
  </defs>

  <!-- Background Base Container -->
  <g clip-path="url(#frame-clip)">
    <rect width="940" height="320" fill="url(#bg-grad)"/>
    <rect width="940" height="320" fill="url(#dot-matrix)"/>
    <rect width="940" height="320" fill="url(#glow-cyan)" class="anim-glow"/>
    <rect width="940" height="320" fill="url(#glow-violet)"/>

    <!-- Subtle circuit track lines in background -->
    <path d="M 0 160 L 220 160 L 260 200 L 940 200" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1.5"/>
    <path d="M 0 60 L 640 60 L 680 100 L 940 100" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1.5"/>

    <!-- Animated Light Beam along top border -->
    <rect class="anim-beam" y="0" x="0" width="300" height="3" fill="url(#beam-grad)"/>
  </g>

  <!-- Outer Border Frame -->
  <rect width="938" height="318" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1"/>
  <path d="M 24 1 L 916 1" stroke="url(#accent-cyan-violet)" stroke-width="2" stroke-linecap="round"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(48, 40)">
    <!-- Status Pill -->
    <rect width="240" height="28" rx="14" fill="rgba(0, 245, 212, 0.08)" stroke="rgba(0, 245, 212, 0.3)" stroke-width="1"/>
    <circle cx="15" cy="14" r="4.5" fill="#00f5d4" class="anim-status"/>
    <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00f5d4" letter-spacing="1.2">SYSTEMS &amp; UI ENGINEER</text>

    <!-- Handle & Location -->
    <text x="844" y="18" font-family="'JetBrains Mono', 'Fira Code', monospace, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">leinhabersv-bit // v2.0</text>
  </g>

  <!-- Main Identity Hero: Oversized RITHIK SV -->
  <g transform="translate(48, 126)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="58" font-weight="900" fill="url(#name-grad)" letter-spacing="-1.5">
      RITHIK SV
    </text>
    <text x="340" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      / Software &amp; Systems Builder
    </text>
  </g>

  <!-- Editorial Subtitle -->
  <g transform="translate(48, 168)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Engineering high-precision web architectures: interactive Three.js graphics, deterministic 2D engines, and local-first data vaults.
    </text>
  </g>

  <!-- Bottom Curated Tech Stack Matrix -->
  <g transform="translate(48, 218)">
    <!-- Pill 1: TypeScript -->
    <g transform="translate(0, 0)">
      <rect width="124" height="38" rx="10" fill="url(#pill-bg)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <circle cx="18" cy="19" r="4" fill="#38bdf8"/>
      <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">TypeScript 5</text>
    </g>

    <!-- Pill 2: Next.js / React -->
    <g transform="translate(138, 0)">
      <rect width="144" height="38" rx="10" fill="url(#pill-bg)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1"/>
      <circle cx="18" cy="19" r="4" fill="#a855f7"/>
      <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Next.js 16 / React</text>
    </g>

    <!-- Pill 3: Three.js & Canvas -->
    <g transform="translate(296, 0)">
      <rect width="170" height="38" rx="10" fill="url(#pill-bg)" stroke="rgba(0, 245, 212, 0.3)" stroke-width="1"/>
      <circle cx="18" cy="19" r="4" fill="#00f5d4"/>
      <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Three.js &amp; 2D Canvas</text>
    </g>

    <!-- Pill 4: Offline-First / IndexedDB -->
    <g transform="translate(480, 0)">
      <rect width="186" height="38" rx="10" fill="url(#pill-bg)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
      <circle cx="18" cy="19" r="4" fill="#38bdf8"/>
      <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Local-First (IndexedDB)</text>
    </g>

    <!-- Pill 5: Playwright & Vitest -->
    <g transform="translate(680, 0)">
      <rect width="164" height="38" rx="10" fill="url(#pill-bg)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
      <circle cx="18" cy="19" r="4" fill="#a855f7"/>
      <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Vitest &amp; Playwright</text>
    </g>
  </g>
</svg>