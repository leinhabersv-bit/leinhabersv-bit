<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 130" width="100%" height="auto">
  <defs>
    <linearGradient id="panic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="panic-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#ff5400"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
  </defs>

  <rect width="920" height="130" rx="12" fill="url(#panic-bg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <path d="M 16 1 L 904 1" stroke="url(#panic-accent)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Icon & Title -->
  <g transform="translate(28, 28)">
    <rect width="44" height="44" rx="8" fill="rgba(255, 0, 85, 0.12)" stroke="rgba(255, 0, 85, 0.3)" stroke-width="1"/>
    <text x="22" y="28" font-size="20" text-anchor="middle">📦</text>
  </g>

  <g transform="translate(86, 38)">
