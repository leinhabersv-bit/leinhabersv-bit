      <stop offset="0%" stop-color="#080E18"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>

    <linearGradient id="c-accent" x1="0%" y1="0%" x2="100%" y2="0%">
